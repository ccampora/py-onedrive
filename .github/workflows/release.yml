name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ruby ruby-dev rubygems build-essential \
            python3-pip fuse3 libfuse3-dev

      # ubuntu-22.04's system `packaging` (21.3) is too old for recent
      # pyfuse3 sdists, whose build backend requires packaging>=26.2 —
      # pip's build isolation still sees the stale system copy on this
      # image, so upgrade it up front rather than letting the pyfuse3
      # build fail with a ContextualVersionConflict.
      - name: Upgrade pip build tooling
        run: python3 -m pip install --upgrade pip setuptools "packaging>=26.2"

      - name: Install fpm
        run: sudo gem install fpm --no-document

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: bash packaging/build-deb.sh "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "py-onedrive_*.deb"
          generate_release_notes: true
          fail_on_unmatched_files: true
