[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-onedrive"
version = "0.1.0"
description = "OneDrive Files On-Demand FUSE client for Linux"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "ccampora", email = "ccampora@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pyfuse3>=3.3.0",
    "trio>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/ccampora/py-onedrive"
Repository = "https://github.com/ccampora/py-onedrive"
Issues = "https://github.com/ccampora/py-onedrive/issues"

[project.scripts]
py-onedrive = "mount:main"
